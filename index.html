<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>網頁程式課作品集 | Course Portfolio</title>
  <!-- 引入 Google Fonts 提升文靜質感 -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================
       文靜柔和風格 (Warm Minimalist / Calm Style)
       ========================================== */
    :root {
      --bg-color: #f7f5f0;            /* 溫暖奶油白底色 */
      --card-bg: #ffffff;             /* 純白卡片底色 */
      --text-main: #33312e;           /* 深石灰文字 */
      --text-sub: #7a7672;            /* 柔和灰色文字 */
      --accent-color: #728678;        /* 鼠尾草綠/莫蘭迪綠點綴 */
      --accent-light: #e8eee9;        /* 淡綠色背景 */
      --border-color: #e5e0d8;        /* 柔和邊框 */
      --locked-bg: #eae8e3;          /* 未解鎖灰色背景 */
      --locked-text: #a09c96;        /* 未解鎖文字顏色 */
      --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 12px 30px rgba(114, 134, 120, 0.12);
      --transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Serif TC', serif, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      background-image: radial-gradient(#e0dad0 1px, transparent 1px);
      background-size: 24px 24px; /* 質感點陣背景 */
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ==========================================
       頁首區塊 (Header)
       ========================================== */
    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .subtitle {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent-color);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.75rem;
    }

    .desc {
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    /* ==========================================
       作品集網格與卡片樣式 (Portfolio Grid & Cards)
       ========================================== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      width: 100%;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.75rem;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
      position: relative;
      overflow: hidden;
    }

    /* 已解鎖卡片 Hover 效果 */
    .card:not(.locked):hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
      border-color: var(--accent-color);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .week-badge {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      background-color: var(--accent-light);
      color: var(--accent-color);
      letter-spacing: 0.05em;
    }

    .status-icon {
      font-size: 0.9rem;
      color: var(--accent-color);
      transition: var(--transition);
    }

    .card:not(.locked):hover .status-icon {
      transform: translateX(4px);
    }

    .card-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-sub);
      line-height: 1.5;
    }

    /* 未解鎖卡片樣式 */
    .card.locked {
      background-color: var(--locked-bg);
      border-color: transparent;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.85;
    }

    .card.locked .week-badge {
      background-color: rgba(160, 156, 150, 0.15);
      color: var(--locked-text);
    }

    .card.locked .card-title,
    .card.locked .card-desc,
    .card.locked .status-icon {
      color: var(--locked-text);
    }

    /* ==========================================
       頁尾 (Footer)
       ========================================== */
    footer {
      margin-top: 3.5rem;
      font-size: 0.85rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="subtitle">Course Portfolio</div>
      <h1>網頁程式課作品集</h1>
      <p class="desc">記錄每週的學習軌跡與互動網頁實作</p>
    </header>

    <main class="grid">
      <!-- Week 1 -->
      <a href="week1/index.html" class="card">
        <div class="card-header">
          <span class="week-badge">WEEK 01</span>
          <span class="status-icon">→</span>
        </div>
        <div>
          <h2 class="card-title">個人自我介紹</h2>
          <p class="card-desc">HTML 基礎架構與 CSS 排版初探</p>
        </div>
      </a>

      <!-- Week 2 -->
      <a href="week2/index.html" class="card">
        <div class="card-header">
          <span class="week-badge">WEEK 02</span>
          <span class="status-icon">→</span>
        </div>
        <div>
          <h2 class="card-title">主題式網頁設計</h2>
          <p class="card-desc">Flexbox 彈性佈局與色彩搭配練習</p>
        </div>
      </a>

      <!-- Week 3 -->
      <a href="week3/index.html" class="card">
        <div class="card-header">
          <span class="week-badge">WEEK 03</span>
          <span class="status-icon">→</span>
        </div>
        <div>
          <h2 class="card-title">互動計數器</h2>
          <p class="card-desc">JavaScript DOM 操作與事件監聽</p>
        </div>
      </a>

      <!-- Week 4 -->
      <a href="week4/index.html" class="card">
        <div class="card-header">
          <span class="week-badge">WEEK 04</span>
          <span class="status-icon">→</span>
        </div>
        <div>
          <h2 class="card-title">待辦事項清單</h2>
          <p class="card-desc">陣列資料處理與動態新增刪除元素</p>
        </div>
      </a>

      <!-- Week 5 (已解鎖：心電感應) -->
      <a href="week5/index.html" class="card">
        <div class="card-header">
          <span class="week-badge">WEEK 05</span>
          <span class="status-icon">→</span>
        </div>
        <div>
          <h2 class="card-title">心電感應</h2>
          <p class="card-desc">直覺與默契的互動網頁小遊戲</p>
        </div>
      </a>

      <!-- Week 6 (未解鎖) -->
      <div class="card locked">
        <div class="card-header">
          <span class="week-badge">WEEK 06</span>
          <span class="status-icon">🔒</span>
        </div>
        <div>
          <h2 class="card-title">敬請期待</h2>
          <p class="card-desc">課程進度尚未解鎖</p>
        </div>
      </div>
    </main>

    <footer>
      <p>© 2026 網頁程式設計課程作品集</p>
    </footer>
  </div>

</body>
</html>
