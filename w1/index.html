<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人數位名片</title>
    <!-- 連結外部的 CSS 檔案 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 名片外框卡片 -->
    <div class="profile-card">
        
        <!-- 1. 圓形大頭貼照片（請將 src 後面換成你的圖片網址或檔名） -->
        <img src=https://lurl.cc/PegQY alt="大頭貼" class="avatar">
        
        <!-- 2. 名字與自我介紹 -->
        <h1 class="name">許文齡</h1>
        <p class="bio">✨ 熱愛生活的色彩，捕捉日常的美好設計新手 ✨</p>
        
        <!-- 3. 按鈕區塊 -->
        <div class="buttons-container">
            <!-- Instagram 按鈕（請將 href 後面換成你的 IG 連結） -->
            <a href="https://instagram.com" target="_blank" class="btn btn-instagram">Instagram</a>
            
            <!-- Email 按鈕（請將 href 後面換成你的 Email） -->
            <a href="mailto:your-email@example.com" class="btn btn-email">Email</a>
        </div>
        
    </div>

</body>
</html>
