<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？｜吃什麼隨機抽籤機</title>
    <!-- 引入 Google Fonts 提升字體質感 -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <!-- CSS 內嵌樣式表 (Ins風：奶油白、燕麥色、米色、淺灰) -->
    <style>
        /* 全局初始化與背景顏色 (燕麥色/淺灰) */
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f4f1ea; /* 柔和燕麥色 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 主卡片容器 (奶油白/米色) */
        .card-container {
            background-color: #faf8f5; /* 奶油白 */
            padding: 3rem 2rem;
            border-radius: 24px; /* 圓潤的邊角 */
            box-shadow: 0 10px 30px rgba(185, 177, 163, 0.2); /* 輕柔的陰影 */
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 1px solid #eeeade; /* 微調邊框 */
            box-sizing: border-box;
        }

        /* 主標題樣式 */
        #main-title {
            color: #5c554c; /* 溫柔的深茶色，避免純黑的生硬感 */
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* 圖片容器與圖片樣式 */
        #image-container {
            margin-bottom: 2rem;
            width: 100%;
            height: 220px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #eeeade;
        }

        #food-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 確保圖片不變形地填滿 */
        }

        /* 按鈕群組 */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        /* 通用按鈕基礎樣式 */
        .btn {
            display: inline-block;
            width: 100%;
            max-width: 200px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 50px; /* 膠囊狀按鈕 */
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none; /* 移除超連結底線 */
            box-sizing: border-box;
        }

        /* 點我抽籤按鈕 (主要按鈕：深色調燕麥/茶色) */
        .btn-primary {
            background-color: #8c8275;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(140, 130, 117, 0.3);
        }

        .btn-primary:hover {
            background-color: #766d62;
            transform: translateY(-2px);
        }

        /* 馬上出發按鈕 (次要按鈕：淺米色) */
        .btn-secondary {
            background-color: #e6e1d5;
            color: #5c554c;
        }

        .btn-secondary:hover {
            background-color: #dbd5c7;
            transform: translateY(-2px);
        }

        /* 控制顯示與隱藏的 class */
        .hidden {
            display: none !important;
        }
    </style>

    <!-- JavaScript 腳本區塊 (等 HTML 載入完成才執行) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // 1. 定義美食資料庫 (包含名稱、照片網址、Google Maps 搜尋連結)
            const foodList = [
                {
                    name: "鴨肉飯",
                    image: "https://unsplash.com", 
                    mapUrl: "https://google.com"
                },
                {
                    name: "煎餃",
                    image: "https://unsplash.com",
                    mapUrl: "https://google.com"
                },
                {
                    name: "食堂",
                    image: "https://unsplash.com",
                    mapUrl: "https://google.com"
                },
                {
                    name: "丹丹漢堡",
                    image: "https://unsplash.com",
                    mapUrl: "https://google.com"
                },
                {
                    name: "雞排",
                    image: "https://unsplash.com",
                    mapUrl: "https://google.com"
                }
            ];

            // 2. 抓取網頁上的 HTML 元素
            const mainTitle = document.getElementById('main-title');
            const drawBtn = document.getElementById('draw-btn');
            const goBtn = document.getElementById('go-btn');
            const imageContainer = document.getElementById('image-container');
            const foodImage = document.getElementById('food-image');

            // 3. 設定按鈕點擊事件
            drawBtn.addEventListener('click', () => {
                
                // 隨機從陣列中挑選一個物件
                const randomIndex = Math.floor(Math.random() * foodList.length);
                const selectedFood = foodList[randomIndex];

                // 替換大標題文字為抽中的美食名稱
                mainTitle.textContent = selectedFood.name;

                // 設定圖片路徑並將圖片區塊顯示出來
                foodImage.src = selectedFood.image;
                imageContainer.classList.remove('hidden');

                // 設定「馬上出發」的 Google Map 連結，並把按鈕顯示出來
                goBtn.href = selectedFood.mapUrl;
                goBtn.classList.remove('hidden');

                // 修改抽籤按鈕的文字，讓人可以重複抽
                drawBtn.textContent = "再抽一次";
            });

        });
    </script>
</head>
<body>

    <div class="card-container">
        <!-- 主標題區塊 -->
        <h1 id="main-title">今天吃什麼？</h1>
        
        <!-- 圖片顯示區塊（抽籤後才會顯示） -->
        <div id="image-container" class="hidden">
            <img id="food-image" src="" alt="食物照片">
        </div>

        <!-- 按鈕區塊 -->
        <div class="btn-group">
            <button id="draw-btn" class="btn btn-primary">點我抽籤</button>
            <a id="go-btn" class="btn btn-secondary hidden" href="#" target="_blank">馬上出發</a>
        </div>
    </div>

</body>
</html>
