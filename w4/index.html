<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板</title>
  <style>
    /* =========================================================
       1. 全局與配色設定 (【顏色調整區】)
       ========================================================= */
    :root {
      /* 主背景顏色：柔和的淡莫蘭迪綠/鼠尾草綠 */
      --bg-color: #EBF0EC; 
      /* 卡片背景顏色：乾淨的暖白 */
      --card-bg: #FFFFFF;
      /* 文字顏色：深綠墨色 (比純黑更具文靜質感) */
      --text-main: #2C3E35;
      /* 次要文字顏色：清淡灰綠 */
      --text-muted: #6B8075;
      /* 主題強調色：沉穩的翡翠綠 */
      --primary-color: #3E6B58;
      /* 發光亮起時的強調色：鮮明但優雅的暖嫩綠光 */
      --highlight-color: #528971;
      /* 發光外框 Glow 效果 */
      --highlight-shadow: 0 12px 30px rgba(62, 107, 88, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* 頁面標題區 */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 500;
      letter-spacing: 2px;
      color: var(--primary-color);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    /* =========================================================
       2. 載入中 (Loading) 動畫區
       ========================================================= */
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
    }

    /* 酷炫的呼吸綠色圓環動畫 */
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(62, 107, 88, 0.15);
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 20px;
    }

    .loading-text {
      color: var(--primary-color);
      font-size: 1.1rem;
      letter-spacing: 2px;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* =========================================================
       3. 瀑布流卡片牆 (Masonry Layout)
       ========================================================= */
    .masonry-grid {
      /* RWD 欄位設定 */
      column-count: 4;          /* 電腦螢幕預設為 4 欄 */
      column-gap: 24px;         /* 欄位之間的間距 */
      max-width: 1200px;
      margin: 0 auto;
      opacity: 0;               /* 載入完成前先隱藏 */
      transition: opacity 0.8s ease;
    }

    .masonry-grid.loaded {
      opacity: 1;               /* 載入完成後淡入顯示 */
    }

    /* 留言卡片樣式 */
    .message-card {
      break-inside: avoid;      /* 關鍵：防止卡片在欄位中途被截斷 */
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid rgba(62, 107, 88, 0.1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      
      /* 轉場動畫：控制亮起與變暗時的滑順度 */
      transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
      cursor: pointer;
    }

    /* 卡片頭部：名字與時間 */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(62, 107, 88, 0.15);
    }

    .author-name {
      font-weight: 600;
      color: var(--primary-color);
      font-size: 1.05rem;
    }

    .timestamp {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* 卡片內容：留言 */
    .message-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-main);
      white-space: pre-wrap;     /* 保留留言中的換行符號 */
      word-break: break-word;
    }

    /* =========================================================
       4. 輪播 Highlight 動畫特效
       ========================================================= */
    
    /* [狀態 1] 被選中的 Highlight 卡片 */
    .message-card.highlight {
      transform: scale(1.08) translateY(-5px); /* 放大並稍微懸浮 */
      border: 2px solid var(--highlight-color);  /* 邊框變亮 */
      box-shadow: var(--highlight-shadow);       /* 綠色發光陰影 */
      opacity: 1 !important;                     /* 強制保持不透明 */
      filter: blur(0px) !important;               /* 強制保持清晰 */
      z-index: 10;                               /* 讓卡片浮在最上層 */
    }

    /* [狀態 2] 其他未被選中的卡片 (當有卡片被 Highlight 時觸發) */
    .masonry-grid.has-highlight .message-card:not(.highlight) {
      opacity: 0.45;                             /* 稍微變透明 */
      filter: blur(1.5px);                       /* 稍微變模糊，營造景深感 */
      transform: scale(0.98);                    /* 稍微縮小 */
    }

    /* =========================================================
       5. 響應式斷點 (RWD)
       ========================================================= */
    @media (max-width: 1024px) {
      .masonry-grid { column-count: 3; }
    }
    @media (max-width: 768px) {
      .masonry-grid { column-count: 2; }
    }
    @media (max-width: 480px) {
      .masonry-grid { column-count: 1; }
    }
  </style>
</head>
<body>

  <header>
    <h1>森林悄悄話留言板</h1>
    <p>—— 來自朋友們的溫暖絮語 ——</p>
  </header>

  <!-- 讀取中動畫區塊 -->
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <!-- 留言牆容器 -->
  <main class="masonry-grid" id="masonry-grid"></main>

  <script>
    // =========================================================
    // 【參數設定區】可依需求修改
    // =========================================================
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmSQKO0YImQ7y7RHlvxDJEEuSBu6lv08BkKl-v-42gsMm3AfuJ_Kz6TUGvByeJXlToYyHQ5Ts-pWzW/pub?output=csv';
    
    // 控制輪播切換的時間 (單位: 毫秒, 3000ms = 3秒)
    const ROTATE_INTERVAL = 3000; 

    // 全局變數
    let messagesData = [];
    let currentIndex = 0;
    let carouselTimer = null;

    // =========================================================
    // 1. CSV 解析器 (相容留言內容包含逗號與雙引號的情境)
    // =========================================================
    function parseCSV(text) {
      const lines = text.split(/\r\n|\n/);
      const result = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        const row = [];
        let insideQuote = false;
        let entry = '';

        for (let j = 0; j < line.length; j++) {
          const char = line[j];

          if (char === '"') {
            insideQuote = !insideQuote; // 切換引號狀態
          } else if (char === ',' && !insideQuote) {
            row.push(entry.trim().replace(/^"|"$/g, '')); // 存入欄位並清空雙引號
            entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry.trim().replace(/^"|"$/g, ''));
        result.push(row);
      }

      // 移除第一個 Header 列 (時間戳記, 名字, 悄悄話)
      return result.slice(1);
    }

    // =========================================================
    // 2. Fetch 抓取 Google 試算表資料
    // =========================================================
    async function fetchMessages() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('網路回應錯誤');

        const csvText = await response.text();
        const rawData = parseCSV(csvText);

        // 將陣列轉為結構化物件 (對應欄位: [0]時間, [1]名字, [2]悄悄話)
        messagesData = rawData.map(row => ({
          timestamp: row[0] || '未知時間',
          name: row[1] || '匿名朋友',
          content: row[2] || '這是一則空白留言'
        }));

        // 渲染畫面並隱藏 Loading
        renderCards(messagesData);
        hideLoading();

        // 開始實施 3 秒輪播特效
        if (messagesData.length > 0) {
          startCarousel();
        }

      } catch (error) {
        console.error('讀取失敗:', error);
        document.querySelector('.loading-text').innerText = '留言讀取失敗，請稍後再試。';
      }
    }

    // 隱藏載入動畫
    function hideLoading() {
      const loading = document.getElementById('loading-container');
      const grid = document.getElementById('masonry-grid');
      
      loading.style.display = 'none';
      grid.classList.add('loaded');
    }

    // =========================================================
    // 3. 動態渲染留言卡片
    // =========================================================
    function renderCards(data) {
      const grid = document.getElementById('masonry-grid');
      grid.innerHTML = '';

      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'message-card';
        card.setAttribute('data-index', index);

        // 整理時間格式 (簡易修飾)
        const dateStr = item.timestamp.split(' ')[0] || item.timestamp;

        card.innerHTML = `
          <div class="card-header">
            <span class="author-name">${escapeHTML(item.name)}</span>
            <span class="timestamp">${escapeHTML(dateStr)}</span>
          </div>
          <div class="message-content">${escapeHTML(item.content)}</div>
        `;

        // 點擊卡片時，可以直接聚焦在該卡片並重置計時器
        card.addEventListener('click', () => {
          currentIndex = index;
          highlightCard(currentIndex);
          resetTimer();
        });

        grid.appendChild(card);
      });
    }

    // HTML XSS 防護處理
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // =========================================================
    // 4. 隨時間輪播特效 (Highlight 控制邏輯)
    // =========================================================
    function highlightCard(index) {
      const grid = document.getElementById('masonry-grid');
      const cards = document.querySelectorAll('.message-card');

      if (cards.length === 0) return;

      // 加入 class 讓整體牆面觸發變暗/變模糊效果
      grid.classList.add('has-highlight');

      // 移除所有卡片的 Highlight 狀態
      cards.forEach(card => card.classList.remove('highlight'));

      // 幫當前被選中的卡片加上 Highlight
      const targetCard = cards[index];
      if (targetCard) {
        targetCard.classList.add('highlight');

        // 平滑滾動讓當前聚焦卡片儘量呈現於螢幕視野 (適合手機端觀看)
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    // 啟動計時器
    function startCarousel() {
      // 立即執行一次第一張
      highlightCard(currentIndex);

      // 每 3 秒切換至下一張
      carouselTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % messagesData.length;
        highlightCard(currentIndex);
      }, ROTATE_INTERVAL);
    }

    // 重置計時器 (手動點擊卡片時呼叫)
    function resetTimer() {
      clearInterval(carouselTimer);
      carouselTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % messagesData.length;
        highlightCard(currentIndex);
      }, ROTATE_INTERVAL);
    }

    // 網頁載入完成後執行
    document.addEventListener('DOMContentLoaded', fetchMessages);
  </script>
</body>
</html>
