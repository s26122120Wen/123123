<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>森森二選一｜拍照雲端投票器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            forest: {
              950: '#0f2318',
              900: '#163022',
              800: '#1f422f',
              700: '#2d5a42',
              600: '#3d7557',
              500: '#52936f',
              200: '#cde2d5',
              100: '#e6f1ea',
              50:  '#f4f9f6',
            },
            moss: {
              500: '#7c9a6e',
              400: '#9ab68d',
            },
            amberwood: {
              600: '#b4692e',
              500: '#d4823f',
              100: '#faeadc',
            },
            cream: '#f7f6f0'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f7f6f0;
      background-image: radial-gradient(#cde2d5 1px, transparent 1px);
      background-size: 20px 20px;
      color: #163022;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid #cde2d5;
    }
    /* 隱藏原生檔案上傳按鈕 */
    input[type="file"] {
      display: none;
    }
    /* 進度條動畫 */
    .bar-fill {
      transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-6 px-4">

  <!-- 頂部導覽列 & 隱藏管理員開票彩蛋 -->
  <header class="w-full max-w-md flex items-center justify-between mb-5 relative">
    <div class="flex items-center gap-2.5 cursor-pointer" onclick="goHome()">
      <div class="w-10 h-10 rounded-2xl bg-forest-800 text-cream flex items-center justify-center shadow-md">
        <!-- 森林松樹 SVG -->
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3L4 14h5l-3 6h12l-3-6h5L12 3z" />
        </svg>
      </div>
      <div>
        <h1 class="text-lg font-black tracking-wide text-forest-900 leading-tight">森森二選一</h1>
        <p class="text-xs text-forest-600 font-medium">拍照・雲端存圖・定時開票</p>
      </div>
    </div>

    <!-- 右上角隱藏管理員彩蛋（點擊 3 下或直接點擊圖示觸發提前開票） -->
    <button id="adminEasterEgg" onclick="triggerAdminClose()" title="房主彩蛋：提前開票"
      class="w-9 h-9 rounded-full flex items-center justify-center text-forest-700/40 hover:text-forest-800 hover:bg-forest-100 transition">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
        <path d="M10 2a6 6 0 00-6 6c0 1.887-.454 3.665-1.257 5.234a.75.75 0 00.515 1.076 32.91 32.91 0 003.256.508 3.5 3.5 0 006.972 0 32.903 32.903 0 003.256-.508.75.75 0 00.515-1.076A11.448 11.448 0 0116 8a6 6 0 00-6-6z" />
      </svg>
    </button>
  </header>

  <!-- 全域讀取遮罩 -->
  <div id="loadingOverlay" class="hidden fixed inset-0 bg-forest-950/60 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-white px-6 text-center">
    <div class="w-12 h-12 border-4 border-forest-200 border-t-amberwood-500 rounded-full animate-spin mb-4"></div>
    <p id="loadingText" class="text-base font-bold tracking-wide">正在上傳照片至森林雲端...</p>
    <p class="text-xs text-forest-200 mt-1">圖片已自動壓縮為 800x800 正方形</p>
  </div>

  <!-- 主容器 -->
  <main class="w-full max-w-md">

    <!-- ==================== 視圖 1：建立新投票 ==================== -->
    <section id="createView" class="glass-card rounded-3xl p-5 shadow-lg space-y-5">
      <div>
        <label class="block text-sm font-bold text-forest-800 mb-1.5">🌿 1. 這次要幫你決定什麼？</label>
        <input id="pollTitle" type="text" maxlength="40" placeholder="例如：午餐吃拉麵還是咖哩飯？"
          class="w-full px-4 py-3 rounded-2xl bg-forest-50 border border-forest-200 focus:outline-none focus:border-forest-600 focus:ring-2 focus:ring-forest-600/20 text-forest-950 font-medium placeholder-forest-600/50" />
      </div>

      <!-- A / B 拍照區 -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-bold text-forest-800">📸 2. 點擊拍攝或上傳照片 (1:1 裁切)</span>
          <span class="text-[11px] bg-forest-100 text-forest-700 px-2 py-0.5 rounded-full font-medium">自動壓縮 800px</span>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <!-- 選項 A -->
          <div class="space-y-2">
            <label for="fileA" class="block aspect-square rounded-2xl border-2 border-dashed border-forest-500/60 bg-forest-50 hover:bg-forest-100/70 transition cursor-pointer overflow-hidden relative group">
              <img id="previewA" class="hidden w-full h-full object-cover" alt="選項 A 預覽" />
              <div id="placeholderA" class="w-full h-full flex flex-col items-center justify-center p-3 text-center">
                <div class="w-11 h-11 rounded-full bg-forest-700 text-white flex items-center justify-center mb-2 shadow group-hover:scale-105 transition">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                </div>
                <span class="text-xs font-bold text-forest-800">拍攝選項 A</span>
                <span class="text-[10px] text-forest-600 mt-0.5">點擊開啟相機</span>
              </div>
              <span class="absolute top-2 left-2 bg-forest-900/80 text-white text-xs font-black px-2.5 py-0.5 rounded-lg">A</span>
            </label>
            <input id="fileA" type="file" accept="image/*" capture="environment" onchange="handleImageSelect(event, 'A')" />
            <input id="labelA" type="text" maxlength="16" placeholder="選項 A 名稱 (選填)"
              class="w-full px-3 py-2 text-xs rounded-xl bg-forest-50 border border-forest-200 focus:outline-none focus:border-forest-600 text-forest-900" />
          </div>

          <!-- 選項 B -->
          <div class="space-y-2">
            <label for="fileB" class="block aspect-square rounded-2xl border-2 border-dashed border-amberwood-500/70 bg-amberwood-100/30 hover:bg-amberwood-100/60 transition cursor-pointer overflow-hidden relative group">
              <img id="previewB" class="hidden w-full h-full object-cover" alt="選項 B 預覽" />
              <div id="placeholderB" class="w-full h-full flex flex-col items-center justify-center p-3 text-center">
                <div class="w-11 h-11 rounded-full bg-amberwood-600 text-white flex items-center justify-center mb-2 shadow group-hover:scale-105 transition">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                </div>
                <span class="text-xs font-bold text-amberwood-600">拍攝選項 B</span>
                <span class="text-[10px] text-forest-700 mt-0.5">點擊開啟相機</span>
              </div>
              <span class="absolute top-2 left-2 bg-amberwood-600 text-white text-xs font-black px-2.5 py-0.5 rounded-lg">B</span>
            </label>
            <input id="fileB" type="file" accept="image/*" capture="environment" onchange="handleImageSelect(event, 'B')" />
            <input id="labelB" type="text" maxlength="16" placeholder="選項 B 名稱 (選填)"
              class="w-full px-3 py-2 text-xs rounded-xl bg-forest-50 border border-forest-200 focus:outline-none focus:border-forest-600 text-forest-900" />
          </div>
        </div>
      </div>

      <!-- 截止時間設定 -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-sm font-bold text-forest-800">⏳ 3. 設定截止開票時間</label>
          <div class="flex gap-1">
            <button type="button" onclick="setQuickDeadline(5)" class="text-[11px] px-2 py-0.5 rounded-md bg-forest-100 hover:bg-forest-200 text-forest-800 font-medium">+5分</button>
            <button type="button" onclick="setQuickDeadline(30)" class="text-[11px] px-2 py-0.5 rounded-md bg-forest-100 hover:bg-forest-200 text-forest-800 font-medium">+30分</button>
            <button type="button" onclick="setQuickDeadline(60)" class="text-[11px] px-2 py-0.5 rounded-md bg-forest-100 hover:bg-forest-200 text-forest-800 font-medium">+1小時</button>
          </div>
        </div>
        <input id="deadlineInput" type="datetime-local"
          class="w-full px-4 py-2.5 rounded-2xl bg-forest-50 border border-forest-200 focus:outline-none focus:border-forest-600 text-forest-900 font-medium text-sm" />
      </div>

      <!-- 建立按鈕 -->
      <button onclick="createPoll()"
        class="w-full py-3.5 rounded-2xl bg-forest-800 hover:bg-forest-900 active:scale-[0.99] text-white font-bold text-base shadow-lg shadow-forest-900/20 transition flex items-center justify-center gap-2">
        <span>🌲 建立投票並產生專屬網址</span>
      </button>
    </section>

    <!-- ==================== 視圖 2：投票與開票結果頁 ==================== -->
    <section id="voteView" class="hidden space-y-4">
      <!-- 狀態與倒數卡片 -->
      <div class="glass-card rounded-3xl p-5 shadow-lg">
        <div class="flex items-center justify-between gap-2 mb-2">
          <span id="statusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-forest-100 text-forest-800">
            <span class="w-2 h-2 rounded-full bg-forest-600 animate-pulse"></span>
            投票進行中
          </span>
          <span id="pollIdTag" class="text-xs font-mono text-forest-600 bg-forest-50 px-2.5 py-1 rounded-lg border border-forest-200"></span>
        </div>

        <h2 id="displayTitle" class="text-xl font-black text-forest-950 leading-snug mb-3">載入題目中...</h2>

        <!-- 倒數計時器 -->
        <div class="bg-forest-900 text-cream rounded-2xl p-3 flex items-center justify-between">
          <span class="text-xs text-forest-200 font-medium">⏱️ 距離自動開票</span>
          <span id="countdownText" class="font-mono text-base font-bold tracking-wider text-amberwood-500">--:--:--</span>
        </div>
      </div>

      <!-- 二選一圖片投票卡片 -->
      <div class="grid grid-cols-2 gap-3">
        <!-- 卡片 A -->
        <div id="cardA" onclick="castVote('A')"
          class="glass-card rounded-3xl p-2.5 shadow-md cursor-pointer transition-all duration-200 hover:-translate-y-0.5 border-2 border-transparent flex flex-col">
          <div class="aspect-square rounded-2xl overflow-hidden bg-forest-100 relative mb-2.5">
            <img id="imgA" src="" alt="選項 A" class="w-full h-full object-cover" />
            <span class="absolute top-2 left-2 bg-forest-900/85 text-white text-xs font-black px-2.5 py-0.5 rounded-lg">A</span>
            <div id="winBadgeA" class="hidden absolute inset-0 bg-forest-900/40 flex items-center justify-center">
              <span class="bg-amberwood-500 text-white text-xs font-black px-3 py-1 rounded-full shadow-lg">👑 最高票勝出</span>
            </div>
          </div>
          <p id="textA" class="text-sm font-bold text-forest-900 text-center truncate px-1">選項 A</p>
          <button id="btnVoteA" class="mt-2 w-full py-2 rounded-xl bg-forest-700 text-white text-xs font-bold hover:bg-forest-800 transition">
            投給 A
          </button>
        </div>

        <!-- 卡片 B -->
        <div id="cardB" onclick="castVote('B')"
          class="glass-card rounded-3xl p-2.5 shadow-md cursor-pointer transition-all duration-200 hover:-translate-y-0.5 border-2 border-transparent flex flex-col">
          <div class="aspect-square rounded-2xl overflow-hidden bg-amberwood-100/50 relative mb-2.5">
            <img id="imgB" src="" alt="選項 B" class="w-full h-full object-cover" />
            <span class="absolute top-2 left-2 bg-amberwood-600 text-white text-xs font-black px-2.5 py-0.5 rounded-lg">B</span>
            <div id="winBadgeB" class="hidden absolute inset-0 bg-forest-900/40 flex items-center justify-center">
              <span class="bg-amberwood-500 text-white text-xs font-black px-3 py-1 rounded-full shadow-lg">👑 最高票勝出</span>
            </div>
          </div>
          <p id="textB" class="text-sm font-bold text-forest-900 text-center truncate px-1">選項 B</p>
          <button id="btnVoteB" class="mt-2 w-full py-2 rounded-xl bg-amberwood-600 text-white text-xs font-bold hover:bg-amberwood-500 transition">
            投給 B
          </button>
        </div>
      </div>

      <!-- 開票結果長條圖（截止或提前開票後顯示） -->
      <div id="resultPanel" class="hidden glass-card rounded-3xl p-5 shadow-lg space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-black text-forest-900">📊 正式開票結果</h3>
          <span id="totalVotesText" class="text-xs font-bold text-forest-600">總票數：0 票</span>
        </div>

        <!-- A 票數條 -->
        <div class="space-y-1">
          <div class="flex justify-between text-xs font-bold">
            <span id="resLabelA" class="text-forest-800">選項 A</span>
            <span id="resStatA" class="text-forest-700">0 票 (0%)</span>
          </div>
          <div class="w-full h-3.5 bg-forest-100 rounded-full overflow-hidden">
            <div id="barA" class="bar-fill h-full bg-forest-700 rounded-full" style="width: 0%"></div>
          </div>
        </div>

        <!-- B 票數條 -->
        <div class="space-y-1">
          <div class="flex justify-between text-xs font-bold">
            <span id="resLabelB" class="text-amberwood-600">選項 B</span>
            <span id="resStatB" class="text-amberwood-600">0 票 (0%)</span>
          </div>
          <div class="w-full h-3.5 bg-amberwood-100 rounded-full overflow-hidden">
            <div id="barB" class="bar-fill h-full bg-amberwood-500 rounded-full" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <!-- 分享連結與操作區 -->
      <div class="glass-card rounded-3xl p-4 shadow-md space-y-2.5">
        <p class="text-xs font-bold text-forest-700">🔗 分享專屬連結給朋友投票</p>
        <div class="flex gap-2">
          <input id="shareUrlInput" type="text" readonly
            class="flex-1 px-3 py-2 rounded-xl bg-forest-50 border border-forest-200 text-xs font-mono text-forest-800 select-all" />
          <button onclick="copyShareLink()"
            class="px-4 py-2 rounded-xl bg-forest-800 hover:bg-forest-900 text-white text-xs font-bold whitespace-nowrap transition">
            複製連結
          </button>
        </div>
        <div class="pt-1 flex justify-between items-center text-xs">
          <button onclick="refreshPollData()" class="text-forest-600 hover:text-forest-900 font-medium underline">
            🔄 重新整理狀態
          </button>
          <button onclick="goHome()" class="text-forest-600 hover:text-forest-900 font-medium">
            ＋ 建立新的投票
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- Toast 提示訊息 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-forest-950 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 z-50">
    提示訊息
  </div>

  <script>
    // ==========================================
    // 1. 核心設定與狀態變數
    // ==========================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyI8wBT2FOR1MeGi1NyKFF7jXQA-rUMAR9YSGouKmKXQotUIPDSuUlF_ZmCIuU36qba/exec";

    let base64ImageA = "";
    let base64ImageB = "";
    let currentPollId = null;
    let currentPollData = null;
    let countdownTimer = null;

    // ==========================================
    // 2. 初始化路由（檢查網址是否有 ?poll=P...）
    // ==========================================
    window.addEventListener("DOMContentLoaded", () => {
      setQuickDeadline(30); // 預設截止時間為 30 分鐘後
      const params = new URLSearchParams(window.location.search);
      const pollId = params.get("poll");

      if (pollId) {
        currentPollId = pollId;
        switchView("vote");
        loadPoll(pollId);
      } else {
        switchView("create");
      }
    });

    function switchView(viewName) {
      document.getElementById("createView").classList.toggle("hidden", viewName !== "create");
      document.getElementById("voteView").classList.toggle("hidden", viewName !== "vote");
    }

    function goHome() {
      if (countdownTimer) clearInterval(countdownTimer);
      // 清除網址參數（相容 CodePen iframe 環境）
      try {
        window.history.pushState({}, "", window.location.pathname);
      } catch (e) {}
      currentPollId = null;
      currentPollData = null;
      switchView("create");
    }

    // ==========================================
    // 3. 快捷時間設定
    // ==========================================
    function setQuickDeadline(minutes) {
      const now = new Date(Date.now() + minutes * 60 * 1000);
      const offset = now.getTimezoneOffset() * 60000;
      const localISOTime = new Date(now - offset).toISOString().slice(0, 16);
      document.getElementById("deadlineInput").value = localISOTime;
    }

    // ==========================================
    // 4. 手機拍照與 Canvas 自動 1:1 裁切壓縮 (800x800)
    // ==========================================
    function handleImageSelect(event, option) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement("canvas");
          const targetSize = 800;
          canvas.width = targetSize;
          canvas.height = targetSize;
          const ctx = canvas.getContext("2d");

          // 計算置中 1:1 正方形裁切區域
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;

          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, targetSize, targetSize);

          // 輸出為 JPEG (品質 0.8) 降低傳輸量
          const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.8);

          if (option === "A") {
            base64ImageA = compressedDataUrl;
            document.getElementById("previewA").src = compressedDataUrl;
            document.getElementById("previewA").classList.remove("hidden");
            document.getElementById("placeholderA").classList.add("hidden");
          } else {
            base64ImageB = compressedDataUrl;
            document.getElementById("previewB").src = compressedDataUrl;
            document.getElementById("previewB").classList.remove("hidden");
            document.getElementById("placeholderB").classList.add("hidden");
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ==========================================
    // 5. 建立投票 (POST 至 GAS)
    // ==========================================
    async function createPoll() {
      const title = document.getElementById("pollTitle").value.trim() || "今天選哪一個好？";
      const labelA = document.getElementById("labelA").value.trim() || "選項 A";
      const labelB = document.getElementById("labelB").value.trim() || "選項 B";
      const deadlineVal = document.getElementById("deadlineInput").value;

      if (!base64ImageA || !base64ImageB) {
        showToast("📸 請先拍攝或選擇 A、B 兩張照片！");
        return;
      }
      if (!deadlineVal) {
        showToast("⏳ 請設定截止開票時間！");
        return;
      }

      const deadlineISO = new Date(deadlineVal).toISOString();
      const pollId = "P" + Date.now().toString(36).toUpperCase();

      showLoading("正在將照片上傳至 Google Drive...");

      try {
        const payload = {
          action: "create",
          pollId: pollId,
          title: title,
          labelA: labelA,
          labelB: labelB,
          imageA: base64ImageA,
          imageB: base64ImageB,
          deadline: deadlineISO
        };

        // 使用 text/plain 避免 GAS CORS 預檢 (Preflight OPTIONS) 問題
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success" || result.pollId) {
          const finalId = result.pollId || pollId;
          currentPollId = finalId;

          // 更新網址列產生 ?poll=P... 專屬連結
          const shareUrl = `${window.location.origin}${window.location.pathname}?poll=${finalId}`;
          try {
            window.history.pushState({}, "", `?poll=${finalId}`);
          } catch (e) {}

          switchView("vote");
          await loadPoll(finalId, shareUrl);
          showToast("🎉 投票建立成功！快分享連結給朋友");
        } else {
          throw new Error(result.message || "建立失敗");
        }
      } catch (err) {
        console.error(err);
        showToast("❌ 上傳失敗，請檢查 GAS 部署權限或網路");
      } finally {
        hideLoading();
      }
    }

    // ==========================================
    // 6. 讀取投票資料 (GET 從 GAS)
    // ==========================================
    async function loadPoll(pollId, customShareUrl = null) {
      showLoading("正在讀取森林雲端投票資料...");
      try {
        const res = await fetch(`${GAS_API_URL}?action=get&pollId=${encodeURIComponent(pollId)}`);
        const data = await res.json();

        if (data.status === "error" || !data.poll) {
          showToast("⚠️ 找不到此投票，可能已被刪除");
          goHome();
          return;
        }

        currentPollData = data.poll;
        renderPollUI(currentPollData, customShareUrl);
      } catch (err) {
        console.error(err);
        showToast("❌ 讀取投票資料失敗");
      } finally {
        hideLoading();
      }
    }

    function refreshPollData() {
      if (currentPollId) loadPoll(currentPollId);
    }

    // ==========================================
    // 7. 渲染投票畫面與即時倒數計時器
    // ==========================================
    function renderPollUI(poll, customShareUrl = null) {
      document.getElementById("pollIdTag").textContent = `#${poll.pollId}`;
      document.getElementById("displayTitle").textContent = poll.title;
      document.getElementById("textA").textContent = poll.labelA || "選項 A";
      document.getElementById("textB").textContent = poll.labelB || "選項 B";
      document.getElementById("imgA").src = poll.imageA;
      document.getElementById("imgB").src = poll.imageB;

      const shareUrl = customShareUrl || `${window.location.origin}${window.location.pathname}?poll=${poll.pollId}`;
      document.getElementById("shareUrlInput").value = shareUrl;

      // 啟動即時倒數
      if (countdownTimer) clearInterval(countdownTimer);
      updateCountdownAndState();
      countdownTimer = setInterval(updateCountdownAndState, 1000);
    }

    function updateCountdownAndState() {
      if (!currentPollData) return;

      const now = Date.now();
      const deadlineTime = new Date(currentPollData.deadline).getTime();
      const diff = deadlineTime - now;
      const isClosed = currentPollData.status === "CLOSED" || diff <= 0;

      const statusBadge = document.getElementById("statusBadge");
      const countdownText = document.getElementById("countdownText");
      const hasVoted = localStorage.getItem(`voted_${currentPollData.pollId}`);

      if (isClosed) {
        if (countdownTimer) clearInterval(countdownTimer);
        countdownText.textContent = "00:00:00 (已截止)";
        statusBadge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-amberwood-100 text-amberwood-600";
        statusBadge.innerHTML = `<span>🔒</span> 已開票鎖定`;

        // 鎖定按鈕並顯示開票長條圖
        lockVotingButtons("已開票");
        showResults(currentPollData);
      } else {
        // 計算時、分、秒
        const hours = Math.floor(diff / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        countdownText.textContent =
          `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

        document.getElementById("resultPanel").classList.add("hidden");
        document.getElementById("winBadgeA").classList.add("hidden");
        document.getElementById("winBadgeB").classList.add("hidden");

        if (hasVoted) {
          lockVotingButtons(`已投給 ${hasVoted}`);
          highlightSelectedCard(hasVoted);
        } else {
          unlockVotingButtons();
        }
      }
    }

    function lockVotingButtons(label) {
      const btnA = document.getElementById("btnVoteA");
      const btnB = document.getElementById("btnVoteB");
      btnA.disabled = true;
      btnB.disabled = true;
      btnA.textContent = label;
      btnB.textContent = label;
      btnA.className = "mt-2 w-full py-2 rounded-xl bg-forest-200 text-forest-700 text-xs font-bold cursor-not-allowed";
      btnB.className = "mt-2 w-full py-2 rounded-xl bg-forest-200 text-forest-700 text-xs font-bold cursor-not-allowed";
    }

    function unlockVotingButtons() {
      const btnA = document.getElementById("btnVoteA");
      const btnB = document.getElementById("btnVoteB");
      btnA.disabled = false;
      btnB.disabled = false;
      btnA.textContent = "投給 A";
      btnB.textContent = "投給 B";
      btnA.className = "mt-2 w-full py-2 rounded-xl bg-forest-700 text-white text-xs font-bold hover:bg-forest-800 transition";
      btnB.className = "mt-2 w-full py-2 rounded-xl bg-amberwood-600 text-white text-xs font-bold hover:bg-amberwood-500 transition";
    }

    function highlightSelectedCard(choice) {
      document.getElementById("cardA").classList.toggle("border-forest-700", choice === "A");
      document.getElementById("cardB").classList.toggle("border-amberwood-500", choice === "B");
    }

    // ==========================================
    // 8. 送出投票 (POST 至 GAS)
    // ==========================================
    async function castVote(choice) {
      if (!currentPollData) return;

      const now = Date.now();
      const deadlineTime = new Date(currentPollData.deadline).getTime();
      if (currentPollData.status === "CLOSED" || now >= deadlineTime) {
        showToast("🔒 投票時間已截止！");
        updateCountdownAndState();
        return;
      }

      if (localStorage.getItem(`voted_${currentPollData.pollId}`)) {
        showToast("✅ 你已經投過票囉！開票後即可查看結果");
        return;
      }

      showLoading(`正在送出你的一票 (${choice})...`);

      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "vote",
            pollId: currentPollData.pollId,
            choice: choice
          })
        });

        const result = await response.json();
        if (result.status === "success") {
          localStorage.setItem(`voted_${currentPollData.pollId}`, choice);
          if (result.poll) currentPollData = result.poll;
          updateCountdownAndState();
          showToast(`🌿 投票成功！已秘密計入選項 ${choice}`);
        } else {
          showToast(result.message || "投票失敗");
        }
      } catch (err) {
        console.error(err);
        showToast("❌ 網路連線異常，請稍後再試");
      } finally {
        hideLoading();
      }
    }

    // ==========================================
    // 9. 顯示正式開票結果
    // ==========================================
    function showResults(poll) {
      const votesA = Number(poll.votesA || 0);
      const votesB = Number(poll.votesB || 0);
      const total = votesA + votesB;

      const pctA = total === 0 ? 0 : Math.round((votesA / total) * 100);
      const pctB = total === 0 ? 0 : 100 - pctA;

      document.getElementById("resultPanel").classList.remove("hidden");
      document.getElementById("totalVotesText").textContent = `總票數：${total} 票`;

      document.getElementById("resLabelA").textContent = `A. ${poll.labelA || "選項 A"}`;
      document.getElementById("resStatA").textContent = `${votesA} 票 (${pctA}%)`;
      document.getElementById("barA").style.width = `${pctA}%`;

      document.getElementById("resLabelB").textContent = `B. ${poll.labelB || "選項 B"}`;
      document.getElementById("resStatB").textContent = `${votesB} 票 (${pctB}%)`;
      document.getElementById("barB").style.width = `${pctB}%`;

      // 標示勝出皇冠
      document.getElementById("winBadgeA").classList.toggle("hidden", !(votesA > votesB));
      document.getElementById("winBadgeB").classList.toggle("hidden", !(votesB > votesA));
    }

    // ==========================================
    // 10. 隱藏管理員彩蛋：房主提前結束並開票
    // ==========================================
    async function triggerAdminClose() {
      if (!currentPollId || !currentPollData) {
        showToast("🌲 彩蛋提示：進入投票頁面後，點擊此處可提前開票！");
        return;
      }

      if (currentPollData.status === "CLOSED") {
        showToast("此投票已經開票完畢囉！");
        return;
      }

      const confirmClose = confirm("【房主管理員彩蛋】\n確定要提前結束倒數並立即公開開票結果嗎？");
      if (!confirmClose) return;

      showLoading("正在執行房主提前開票...");

      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "close",
            pollId: currentPollId
          })
        });

        const result = await response.json();
        if (result.status === "success") {
          currentPollData.status = "CLOSED";
          if (result.poll) currentPollData = result.poll;
          updateCountdownAndState();
          showToast("🎉 已提前開票！結果正式公開");
        } else {
          showToast(result.message || "開票操作失敗");
        }
      } catch (err) {
        console.error(err);
        showToast("❌ 無法連線至 GAS 執行開票");
      } finally {
        hideLoading();
      }
    }

    // ==========================================
    // 11. 工具函式 (複製連結、Loading、Toast)
    // ==========================================
    function copyShareLink() {
      const input = document.getElementById("shareUrlInput");
      input.select();
      input.setSelectionRange(0, 99999);
      navigator.clipboard?.writeText(input.value).then(() => {
        showToast("📋 已複製專屬投票網址！");
      }).catch(() => {
        document.execCommand("copy");
        showToast("📋 已複製專屬投票網址！");
      });
    }

    function showLoading(text) {
      document.getElementById("loadingText").textContent = text;
      document.getElementById("loadingOverlay").classList.remove("hidden");
    }

    function hideLoading() {
      document.getElementById("loadingOverlay").classList.add("hidden");
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.remove("opacity-0");
      setTimeout(() => {
        toast.classList.add("opacity-0");
      }, 2800);
    }
  </script>
</body>
</html>
